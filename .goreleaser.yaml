---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: helloworld

report_sizes: true

gomod:
  proxy: true

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

git:
  ignore_tags:
    - nightly
    - "*-nightly"

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - id: helloworld
    binary: helloworld
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - loong64
      - ppc64le
      - riscv64
      - s390x
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: openbsd
        goarch: "386"
      - goos: openbsd
        goarch: arm
      - goos: openbsd
        goarch: riscv64
      - goos: netbsd
        goarch: "386"
      - goos: netbsd
        goarch: arm
      - goos: netbsd
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: helloworld
    formats: [tar.gz]
    # This name template makes the OS and Arch compatible with uname and includes the version.
    name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    # Wraps the files inside a top-level directory within the archive to prevent tarbombing (Best Practice)
    wrap_in_directory: true
    builds_info:
      group: root
      owner: root
      mtime: "{{ .CommitDate }}"
    # Use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    # Include all relevant standard documentation arrays using Globs
    files:
      - src: "LICENSE*"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: "README*"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: "CHANGELOG*"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"

snapshot:
  version_template: SNAPSHOT-{{ .Commit }}

checksum:
  name_template: "checksums.txt"

release:
  name_template: "{{ .Tag }}"
  prerelease: auto
  github:
    owner: snowdreamtech
    name: helloworld
  header: |
    **Snowdream Tech Helloworld** is a minimal Go application that demonstrates cross-platform binary distribution.
  footer: |
    **Full Changelog**: https://github.com/snowdreamtech/helloworld/compare/{{ .PreviousTag }}...{{ .Tag }}

    ## 🤝 Contributing

    Contributions are welcome! Please read our [Contributing Guide](https://github.com/snowdreamtech/helloworld/blob/main/CONTRIBUTING.md) first.

source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}-source"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "(?i)^test"
      - "(?i)^ci"
      - "(?i)^build"
      - "(?i)^style"
      - "(?i)^revert"
      - "(?i)^chore"
      - "(?i)^deps"
      - "^Merge pull request"
      - "^Merge remote-tracking branch"
      - "^Merge branch"
      - "merge conflict"
      - "^WIP"
      - "^\\[skip ci\\]"
      - "^Bump version"
  groups:
    - title: "🚀 Features"
      regexp: "^.*(?i)feat[(\\w)]*:+.*$"
      order: 100
    - title: "🐛 Bug Fixes"
      regexp: "^.*(?i)fix[(\\w)]*:+.*$"
      order: 200
    - title: "⚡️ Performance Improvements"
      regexp: "^.*(?i)perf[(\\w)]*:+.*$"
      order: 300
    - title: "🛠 Refactoring"
      regexp: "^.*(?i)refactor[(\\w)]*:+.*$"
      order: 400
    - title: "🛡️ Security Updates"
      regexp: "^.*(?i)(sec|security)[(\\w)]*:+.*$"
      order: 600
    - title: "📖 Documentation"
      regexp: "^.*(?i)docs[(\\w)]*:+.*$"
      order: 700
    - title: "♻️ Miscellaneous Chores"
      order: 9999

nfpms:
  - id: default
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://github.com/snowdreamtech/helloworld
    maintainer: "Snowdream Tech <snowdreamtech@qq.com>"
    description: |-
      Snowdream Tech Helloworld is a minimal Go application that demonstrates cross-platform binary distribution.
    license: MIT
    vendor: SnowdreamTech
    bindir: /usr/bin
    section: utils
    mtime: "{{ .CommitDate }}"
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    dependencies:
      - git
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package

universal_binaries:
  - replace: false

sboms:
  # Generate SBOMs for all release artifacts: archives (tar.gz/zip) and Linux packages (deb/rpm/apk/archlinux)
  - id: archive
    artifacts: archive
  - id: package
    artifacts: package

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    output: '{{ not (isEnvSet "CI") }}'
    artifacts: checksum
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes # Enables keyless signing via OIDC token
